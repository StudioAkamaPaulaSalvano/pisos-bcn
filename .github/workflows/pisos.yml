name: Buscar pisos Barcelona

# Corre casi todo el tiempo: cada 10 min se relanza y, dentro, hace un ciclo
# cada ~3-4 min. Modo rápido (clásicas + pisos.com), sin el scan lento inútil.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# evita que se pisen dos ejecuciones a la vez
concurrency:
  group: buscar-pisos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Buscar en bucle (~9 min, ciclo cada ~3-4 min)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          git config user.name "pisos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          END=$((SECONDS+540))       # ~9 minutos de bucle
          while [ $SECONDS -lt $END ]; do
            python app/scrape.py --fast || true
            python app/build_page.py || true
            mkdir -p docs && cp app/web/index.html docs/index.html
            python app/notify.py || true
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualizar pisos ($(date -u '+%H:%M') UTC)"
              git pull --rebase -q || true
              git push -q || true
            fi
            sleep 200
          done

name: Buscar pisos Barcelona

# Bucle continuo: una corrida larga trabaja ~1h haciendo un ciclo cada ~5 min,
# y se reinicia cada hora. NO depende del cron */5 de GitHub (que es poco fiable).
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
    - cron: "0 19 * * *"   # reinicio diario a las 21:00 de Barcelona (19:00 UTC)
  workflow_dispatch:

# solo una corrida a la vez (no cancela la que está trabajando)
concurrency:
  group: buscar-pisos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # corre ~5,5 h seguidas (máx GitHub = 6 h)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Buscar en bucle (~26 min, ciclo cada ~5 min)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          git config user.name "pisos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          END=$((SECONDS+19800))     # ~5,5 h de bucle continuo (una corrida cubre casi el día)
          while [ $SECONDS -lt $END ]; do
            python app/scrape.py --fast || true
            python app/build_page.py || true
            mkdir -p docs && cp app/web/index.html docs/index.html
            python app/notify.py || true
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualizar pisos ($(date -u '+%H:%M') UTC)"
              git pull --rebase -q || true
              git push -q || true
            fi
            sleep 240
          done

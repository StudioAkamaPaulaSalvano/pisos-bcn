name: Buscar pisos Barcelona

# Cada llamada hace UNA pasada rápida y termina. La dispara el despertador
# externo (cron-job.org) cada 5 min. El cron */30 es solo respaldo por si el
# despertador falla.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# una corrida nueva REEMPLAZA a la anterior -> nunca se acumula un proceso colgado
concurrency:
  group: buscar-pisos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # una pasada corta; nada puede quedar colgado horas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cachear navegador (arranque rápido)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Una pasada (buscar pisos + publicar)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          git config user.name "pisos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          python app/scrape.py --fast || true
          python app/build_page.py || true
          mkdir -p docs && cp app/web/index.html docs/index.html
          python app/notify.py || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Actualizar pisos ($(date -u '+%H:%M') UTC)"
            git pull --rebase -q || true
            git push -q || true
          fi
